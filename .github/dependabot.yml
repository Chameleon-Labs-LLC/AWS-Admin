# Dependabot: free, GitHub-side dependency and advisory monitoring.
# Policy: ~/.config/agents/AGENTS.md -> "Dependency, code, and secret scanning".
#
# Shape:
#   - Security updates are grouped into ONE PR per ecosystem so a bad week does
#     not open fifteen PRs.
#   - Version updates run weekly, minor+patch only, grouped. Majors are done by
#     hand with a changelog read. The `ignore` of semver-major below gates
#     VERSION updates only: SECURITY updates walk past it, so a security fix
#     that lives in a new major still arrives as a PR. "No PR" never means
#     "no vulnerability" -- transitive-only deps and advisories with no fixed
#     version show up only as alerts. Read the alerts.
#   - cooldown mirrors the 7-day minimum-package-age rule for version updates.
#     Security updates are not delayed by cooldown: remediation wins.
#   - A Dependabot PR carries no version bump; fold it into the next release.
#
# This repo has exactly two ecosystems: `pip` (the setuptools `pyproject.toml`
# at the root -- boto3, cryptography, psycopg) and `github-actions` (the
# workflow added alongside this file). npm and nuget blocks were dropped: there
# is no package.json and no .csproj here.
#
# Dependabot is also carrying more weight here than usual: there is no
# lockfile, so `osv-scanner` cannot read this repo's dependencies and the
# security workflow runs gitleaks only. These alerts are the dependency
# coverage. See the comment at the top of .github/workflows/security.yml.
#
# The pip block deliberately omits `update-types` from its version-update
# group: this project declares loose floors (`boto3>=1.34`), so updates arrive
# as REQUIREMENT changes, which carry no from->to pair and therefore match NO
# `update-types` value -- adding the filter silently drops every such update
# out of the group and opens one PR each. (That cost ChameleonLabs 22 PRs in a
# day.)
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/Chicago
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
      # No `update-types` filter here -- see the comment above.
      minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:30"
      timezone: America/Chicago
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
      actions:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
